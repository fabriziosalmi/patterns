# A bad-bot list that does what the generated one should: it refuses the bots and the HTTP
# libraries it names, each with an id of its own, and nothing a site wants. The test runs it
# first, so that the checks on the bad-bot list are shown to pass on a list that is right.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)sqlmap" "id:8100001,phase:1,t:none,deny,status:403,log"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)AhrefsBot" "id:8100002,phase:1,t:none,deny,status:403,log"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)SemrushBot" "id:8100003,phase:1,t:none,deny,status:403,log"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)MJ12bot" "id:8100004,phase:1,t:none,deny,status:403,log"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)curl" "id:8100005,phase:1,t:none,deny,status:403,log"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)python-requests" "id:8100006,phase:1,t:none,deny,status:403,log"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)Go-http-client" "id:8100007,phase:1,t:none,deny,status:403,log"
