# A bad-bot list that does what the generated one should: it refuses the bots and the
# HTTP libraries it names, and nothing a site wants. The test runs it first, so that the
# checks on the bad-bot list are shown to pass on a list that is right.
[http.middlewares.bad_bot_block.plugin.blockuseragent]
  regex = [
    '(?i)sqlmap',
    '(?i)AhrefsBot',
    '(?i)SemrushBot',
    '(?i)MJ12bot',
    '(?i)curl',
    '(?i)python-requests',
    '(?i)Go-http-client',
  ]
