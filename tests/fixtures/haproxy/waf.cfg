# A configuration that is known to load, for checking the test itself: if this does not
# pass, the harness is what is broken, not the generated output. It is what the generated
# waf.cfg is, with two pattern files: lines to paste into a frontend.
acl waf_user_agent hdr(user-agent) -m reg -f /etc/haproxy/waf/waf-user-agent.acl
acl waf_query_string_urldecode query,url_dec(1) -m reg -f /etc/haproxy/waf/waf-query-string-urldecode.acl
http-request deny deny_status 403 if waf_user_agent or waf_query_string_urldecode
