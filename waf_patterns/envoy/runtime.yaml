# Merge this into the bootstrap. Envoy compiles an expression of RE2 program size 100 at
# most unless it is told otherwise, and a CRS expression is bigger.

layered_runtime:
  layers:
  - name: waf
    static_layer:
      re2:
        max_program_size:
          error_level: 1000000
          warn_level: 1000000
