# Envoy WAF - Bad Bot Blocker
# One item of `http_filters`, before `envoy.filters.http.router`: it refuses a request
# whose User-Agent matches an entry with a 403.
# Left out, an ordinary client would be refused: Apache-HttpClient (matches apache httpclient)
# Left out, an ordinary client would be refused: Citoid (matches citoid)
# Left out, an ordinary client would be refused: Disco (matches discord link preview)
# Left out, an ordinary client would be refused: Pingdom (matches pingdom)
# Left out, an ordinary client would be refused: StatusCake (matches statuscake)
# Left out, an ordinary client would be refused: WhatsApp (matches whatsapp link preview)
# Left out, an ordinary client would be refused: Yandex(?!Search) (matches yandexbot)
# Left out, an ordinary client would be refused: ZoteroTranslationServer (matches zotero-translation-server)
# Left out, an ordinary client would be refused: [a-z0-9\-_]*(bot|crawl|headless|archiver|transcoder|spider|uptime|validator|fetcher|cron|checker|reader|extractor|monitoring|analyzer|scraper) (matches googlebot)
# Left out, an ordinary client would be refused: acebookexternalhit\/ (matches facebook link preview)
# Left out, an ordinary client would be refused: baidu\.com (matches baiduspider)
# Left out, an ordinary client would be refused: facebookexternalhit (matches facebook link preview)
# Left out, an ordinary client would be refused: oBot (matches slack link preview)

- name: waf_bots
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
    rules:
      action: DENY
      policies:
        waf_bots_user_agent:
          permissions:
          - or_rules:
              rules:
              # bad bot
              - header:
                  name: 'user-agent'
                  string_match:
                    safe_regex:
                      regex: '(?s:.*)(?i: YLT)(?s:.*)'
