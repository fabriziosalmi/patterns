# Nginx WAF Rules (Generated by json2nginx.py)
#
# Include this file inside a `server` or `location` block.
# Requires waf_maps.conf to be included in the `http` block.
#
# NOTHING IS BLOCKED BY THIS FILE.
#
# The rules extracted from the Core Rule Set carry no severity, so no
# pattern reaches the `high` level that would trigger a 403, and no
# blocking directive is emitted rather than one that can never fire.
#
# Matches are still recorded. These variables hold
# "<severity>:<category>" when a pattern matches, and "" otherwise:
#
#   $waf_request_uri
#
# Use them in log_format to see what would match your own traffic
# before enforcing anything:
#
#   log_format waf '$remote_addr $request "$waf_request_uri" "$waf_args"';
#
# To block on any match, uncomment the directives below. Measured
# against a running nginx, that blocks XSS, SQL injection, Log4Shell
# and path traversal, and also refuses an ordinary `?url=` or
# `?email=` parameter. That false-positive profile is what CRS itself
# manages with anomaly scoring, which this project does not have yet.
# Measure first, then decide. See
# https://github.com/fabriziosalmi/patterns/issues/45
#
#   if ($waf_request_uri) { return 403; }
