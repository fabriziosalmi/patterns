#
# Paste these lines into a `frontend` (or `listen`) section, and put the pattern files in
# /etc/haproxy/waf/. HAProxy has no include, so this is not a file to load on its own.

acl waf_content_type hdr(content-type) -m reg -f /etc/haproxy/waf/waf-content-type.acl
acl waf_content_type_lowercase hdr(content-type),lower -m reg -f /etc/haproxy/waf/waf-content-type-lowercase.acl
acl waf_host hdr(host) -m reg -f /etc/haproxy/waf/waf-host.acl
acl waf_query_string query -m reg -f /etc/haproxy/waf/waf-query-string.acl
acl waf_query_string_lowercase query,lower -m reg -f /etc/haproxy/waf/waf-query-string-lowercase.acl
acl waf_query_string_lowercase_urldecode query,lower,url_dec(1) -m reg -f /etc/haproxy/waf/waf-query-string-lowercase-urldecode.acl
acl waf_query_string_urldecode query,url_dec(1) -m reg -f /etc/haproxy/waf/waf-query-string-urldecode.acl
acl waf_query_string_urldecode_lowercase query,url_dec(1),lower -m reg -f /etc/haproxy/waf/waf-query-string-urldecode-lowercase.acl
acl waf_referer_lowercase_urldecode hdr(referer),lower,url_dec(1) -m reg -f /etc/haproxy/waf/waf-referer-lowercase-urldecode.acl
acl waf_referer_urldecode hdr(referer),url_dec(1) -m reg -f /etc/haproxy/waf/waf-referer-urldecode.acl
acl waf_request_filename_urldecode path,url_dec(1) -m reg -f /etc/haproxy/waf/waf-request-filename-urldecode.acl
acl waf_user_agent hdr(user-agent) -m reg -f /etc/haproxy/waf/waf-user-agent.acl
http-request deny deny_status 403 if waf_content_type or waf_content_type_lowercase or waf_host or waf_query_string or waf_query_string_lowercase or waf_query_string_lowercase_urldecode or waf_query_string_urldecode or waf_query_string_urldecode_lowercase or waf_referer_lowercase_urldecode or waf_referer_urldecode or waf_request_filename_urldecode or waf_user_agent
