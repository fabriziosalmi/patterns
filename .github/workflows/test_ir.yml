name: IR validation

permissions:
  contents: read  # Needed to read the schema and the committed rules

on:
  push:
    branches:
      - main
  # Any base, not only main: a pull request stacked on another one is tested too.
  pull_request:

jobs:
  validate-ir:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor the docs state and what the other workflows run on.
        # 3.9 cannot install requirements.txt: requests>=2.34.2 needs 3.10.
        python-version: ["3.11", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r requirements.txt

    # What the extractor reads out of a rule: variables, operator, phase, chain,
    # score. Fixtures are CRS directives copied verbatim.
    - name: Extract what a rule declares
      run: python3 tests/test_ir_extraction.py

    # The committed owasp_rules.json against schema/ir.schema.json, the schema's
    # own refusals, and the version pin. Editing the schema without raising
    # schema_version fails here.
    - name: Validate owasp_rules.json against the schema
      run: python3 tests/test_ir_schema.py

  # Every target is built from the committed IR and has to be what is committed.
  # The converters used to write a set, so two runs on the same input gave
  # different files and there was nothing to compare with.
  build-reproducible:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements.txt

    # The command line, the registry, the same bytes across hash seeds, and the
    # json2*.py entry points that came before it.
    - name: Test the command line and the build
      run: python3 tests/test_cli.py

    # What each target does with each rule, and that the matrix counts what the
    # files hold.
    - name: Test the coverage matrix
      run: python3 tests/test_coverage.py

    # The corpus of ordinary traffic every candidate rule is checked against: each
    # entry says what it is and why, and nothing in it is real.
    - name: Test the corpus of ordinary traffic
      run: python3 tests/test_corpus.py

    # What a release is made of and what it is called: archives that are the same
    # bytes for the same files, the tag, and that nothing is ever deleted.
    - name: Test the release
      run: python3 tests/test_release.py

    # What changed between two versions of the rules, rule by rule and target by
    # target.
    - name: Test the diff between releases
      run: python3 tests/test_diff.py

    - name: Fail if the committed output is stale
      run: python3 -m patterns build --all --check

    - name: Fail if the coverage tables are stale
      run: python3 -m patterns coverage --check
