name: Update Patterns

permissions:
  contents: write  # Commit and push what was built, and publish the release
  issues: write    # Open an issue when the build fails its checks
  actions: read    # Required for checking out the repository

# The order of this job is the point of it:
#
#   build   fetch the rules, compile them for every target, refresh the tables
#   gate    run the tests on what was just built
#   publish commit, push and release, only if every check above passed
#
# It used to build, then commit, then release, and never tested: the commit step
# ran `git add .` and then `git diff --quiet`, which compares the working tree
# with what was just added and so never sees a change. Nothing was committed
# after 2025-02-28 while the release was built from the working tree every night.
#
# Publishing is for the default branch only. A run from any other branch (a
# manual dispatch to try a change to this file, or a change to a generator) builds
# and runs the gate and publishes nothing.

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  update-owasp-waf:
    runs-on: ubuntu-latest
    # pipefail, so that a test piped to `tee gate.log` still fails the step.
    defaults:
      run:
        shell: bash

    steps:
    - name: 🚚 Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # get full git history

    - name: ⚙️ Set Up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📥 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🕷️ Run OWASP Scraper
      run: python owasp2json.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # the unauthenticated API limit is 60 an hour

    # Refuses to write anything if a backend would write a regular expression its
    # target's engine does not compile.
    - name: 🔄 Build the WAF rules for every target
      run: python3 -m patterns build --all

    - name: 🔄 Generate Bad Bot Blockers
      run: python badbots.py

    # The tables in the README and docs/coverage.md follow the rules.
    - name: 🔄 Refresh the coverage tables
      run: python3 -m patterns coverage --write

    # --- Gate ---------------------------------------------------------------
    # Everything below runs on what was just built, and nothing is committed or
    # released until all of it passes. Each step adds to gate.log, which an issue
    # quotes when one fails.

    - name: 🚦 Install what the tests need
      run: |
        sudo apt-get update
        sudo apt-get install -y nginx

    - name: 🚦 The rules and what reads them
      run: |
        { python3 -m patterns validate \
          && python3 tests/test_ir_extraction.py \
          && python3 tests/test_ir_schema.py \
          && python3 tests/test_extraction.py \
          && python3 tests/test_resolve_ref.py; } 2>&1 | tee -a gate.log

    - name: 🚦 nginx loads it and blocks attacks, and refuses nothing ordinary
      run: |
        { python3 tests/test_parameter_limit.py \
          && python3 tests/validate_nginx.py \
          && python3 tests/test_nginx_blocking.py; } 2>&1 | tee -a gate.log

    - name: 🚦 What each target does with each rule
      run: |
        { python3 tests/test_coverage.py \
          && python3 tests/test_cli.py; } 2>&1 | tee -a gate.log

    # These three record what each target does today (a known defect, with its
    # issue) and fail when that changes, for better or worse.
    - name: 🚦 Apache, HAProxy and Traefik in their servers
      run: |
        { python3 tests/test_apache_blocking.py \
          && python3 tests/test_haproxy_blocking.py \
          && python3 tests/test_traefik_blocking.py; } 2>&1 | tee -a gate.log

    # --- Publish ------------------------------------------------------------

    - name: 🚀 Commit and push what changed
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add owasp_rules.json waf_patterns README.md docs/coverage.md
        # What was just added, not the working tree against it: `git diff --quiet`
        # after `git add` is always quiet.
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update WAF rules [$(date +'%Y-%m-%d')]"
          git push
        fi

    - name: 📦 Create Zip Archives
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p dist
        (cd waf_patterns/nginx && zip -r ../../dist/nginx_waf.zip .)
        (cd waf_patterns/apache && zip -r ../../dist/apache_waf.zip .)
        (cd waf_patterns/traefik && zip -r ../../dist/traefik_waf.zip .)
        (cd waf_patterns/haproxy && zip -r ../../dist/haproxy_waf.zip .)

    - name: 🗑️ Delete Existing 'latest' Tag and Release (if they exist)
      if: github.ref == 'refs/heads/main'
      run: |
        # Delete local tag
        git tag -d latest || true
        # Delete remote tag (force)
        git push --delete origin latest || true
        # Delete release, --yes for confirmation
        gh release delete latest --yes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    - name: 📝 Generate release notes
      if: success() && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail

        BUILD_DATE=$(date -u +'%Y-%m-%d')

        # The tag the rules were actually converted from, recorded by
        # owasp2json.py. This used to query the CRS latest release separately,
        # so the release notes advertised a version the archives were not built
        # from: the fetcher resolved a prefix and landed on v4.0.0-rc2 while the
        # notes said v4.29.0 (#43). One source of truth now.
        CRS_REF=$(jq -r '._provenance.source_ref' owasp_rules.json)
        if [ -z "$CRS_REF" ] || [ "$CRS_REF" = "null" ]; then
          echo "owasp_rules.json carries no resolved source_ref" >&2
          exit 1
        fi

        # OWASP source coverage (owasp_rules.json is a {_provenance, rules} object;
        # the legacy bare-array form is still handled for backward compatibility)
        TOTAL_RULES=$(jq 'if type=="array" then length else (.rules | length) end' owasp_rules.json)
        CATEGORIES=$(jq -r 'if type=="array" then .[] else .rules[] end | .category' owasp_rules.json | sort -u | wc -l | tr -d ' ')

        # Bot pattern counts per backend
        NGINX_BOTS=$(grep -c '^\s*"~' waf_patterns/nginx/bots.conf || echo 0)
        APACHE_BOTS=$(grep -c '^SecRule REQUEST_HEADERS' waf_patterns/apache/bots.conf || echo 0)
        TRAEFIK_BOTS=$(grep -cE '^\s*"' waf_patterns/traefik/bots.toml || echo 0)
        HAPROXY_BOTS=$(grep -c '^acl' waf_patterns/haproxy/bots.acl || echo 0)

        # Archive sizes (human-readable)
        NGINX_SIZE=$(du -h dist/nginx_waf.zip | cut -f1)
        APACHE_SIZE=$(du -h dist/apache_waf.zip | cut -f1)
        TRAEFIK_SIZE=$(du -h dist/traefik_waf.zip | cut -f1)
        HAPROXY_SIZE=$(du -h dist/haproxy_waf.zip | cut -f1)

        # SHA-256 checksums
        NGINX_SHA=$(sha256sum dist/nginx_waf.zip | cut -d' ' -f1)
        APACHE_SHA=$(sha256sum dist/apache_waf.zip | cut -d' ' -f1)
        TRAEFIK_SHA=$(sha256sum dist/traefik_waf.zip | cut -d' ' -f1)
        HAPROXY_SHA=$(sha256sum dist/haproxy_waf.zip | cut -d' ' -f1)

        # What each target does with each rule, from the record the files were
        # built from (waf_patterns/coverage.json).
        COVERAGE_TABLE=$(python3 -m patterns coverage)

        cat > release_notes.md <<EOF
        **Patterns build · ${BUILD_DATE}**

        OWASP Core Rule Set [\`coreruleset/coreruleset@${CRS_REF}\`](https://github.com/coreruleset/coreruleset/releases/tag/${CRS_REF}) converted into native WAF rules for four web servers. Generated automatically; no manual edits.

        **Coverage:** ${TOTAL_RULES} patterns across ${CATEGORIES} categories &mdash; SQLi, XSS, RCE, LFI, RFI, plus generic anomaly and protocol-violation rules.

        ### Backends

        | Backend  | Format            |    Bots | Archive               |     Size |
        |----------|-------------------|--------:|-----------------------|---------:|
        | Nginx    | \`map\` + \`if\`      | ${NGINX_BOTS}   | \`nginx_waf.zip\`     | ${NGINX_SIZE}    |
        | Apache   | ModSecurity       | ${APACHE_BOTS}   | \`apache_waf.zip\`    | ${APACHE_SIZE}    |
        | Traefik  | Middleware TOML   | ${TRAEFIK_BOTS}   | \`traefik_waf.zip\`   | ${TRAEFIK_SIZE}    |
        | HAProxy  | ACL               | ${HAPROXY_BOTS}   | \`haproxy_waf.zip\`   | ${HAPROXY_SIZE}    |

        ### Quick install

        \`\`\`bash
        curl -LO https://github.com/fabriziosalmi/patterns/releases/latest/download/nginx_waf.zip
        unzip nginx_waf.zip -d /etc/nginx/waf_patterns
        \`\`\`

        Integration guides → [Nginx](https://fabriziosalmi.github.io/patterns/nginx) · [Apache](https://fabriziosalmi.github.io/patterns/apache) · [Traefik](https://fabriziosalmi.github.io/patterns/traefik) · [HAProxy](https://fabriziosalmi.github.io/patterns/haproxy)

        ### What each target does with each rule

        ${COVERAGE_TABLE}

        The verdict for every rule and target is in \`coverage.json\`, attached to this release. [How to read it](https://fabriziosalmi.github.io/patterns/coverage).

        ### Verify (SHA-256)

        \`\`\`text
        ${NGINX_SHA}  nginx_waf.zip
        ${APACHE_SHA}  apache_waf.zip
        ${TRAEFIK_SHA}  traefik_waf.zip
        ${HAPROXY_SHA}  haproxy_waf.zip
        \`\`\`

        \`\`\`bash
        echo "${NGINX_SHA}  nginx_waf.zip" | sha256sum -c -
        \`\`\`

        ---

        [Documentation](https://fabriziosalmi.github.io/patterns/) · [Source](https://github.com/fabriziosalmi/patterns) · [Issues](https://github.com/fabriziosalmi/patterns/issues)
        EOF

        echo "Generated release_notes.md ($(wc -l < release_notes.md) lines)"

    - name: 🚀 Publish release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        name: WAF rules (Nginx, Apache, Traefik, Haproxy)
        body_path: release_notes.md
        files: |
          dist/nginx_waf.zip
          dist/apache_waf.zip
          dist/traefik_waf.zip
          dist/haproxy_waf.zip
          waf_patterns/coverage.json
        make_latest: 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🧹 Clean Up (Optional)
      if: always()  # Run cleanup even on failure
      run: rm -rf ~/.cache/pip

    # A failure anywhere above, the gate included, means nothing was published
    # and the previous release is still the latest. Say so where someone will see
    # it: one open issue, updated while the build keeps failing.
    - name: 🚨 Open or update an issue
      if: failure() && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        {
          echo "The nightly build failed its checks, so nothing was committed or released and the previous release is still the latest."
          echo
          echo "Run: $RUN ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          echo
          if [ -s gate.log ]; then
            echo "The end of what the checks printed:"
            echo
            echo '```text'
            tail -n 60 gate.log
            echo '```'
          else
            echo "It failed before the checks ran; the log of the run says where."
          fi
        } > issue.md
        gh label create nightly-failure --color d73a4a \
          --description "The nightly build failed its checks" 2>/dev/null || true
        NUMBER=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')
        if [ -n "$NUMBER" ]; then
          gh issue comment "$NUMBER" --body-file issue.md
        else
          gh issue create --label nightly-failure \
            --title "The nightly build failed its checks" --body-file issue.md
        fi
